<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ClickUp Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ClickUp Monitor: styles shared with the BSS Team Tracker. */
:root{
  --bg:#f3f4f7; --panel:#ffffff; --sunk:#e9ebf1; --line:#d9dce5; --fg:#1b1f2c; --muted:#5d6477;
  --accent:#2f4fd1; --accent-ink:#ffffff; --accent-soft:#e3e8fc;
  --ok:#1f8a5b; --ok-soft:#dcf2e7; --warn:#b26a00; --warn-soft:#fbecd2; --crit:#c2362f; --crit-soft:#f9dfdd; --idle:#6c7385; --idle-soft:#e6e8ee;
  --m-yut:#2f6fd1; --m-tai:#0f8b8d; --m-pe:#b5541c; --m-ing:#8a46b8; --m-dream:#c0386b;
  --heat0:#eceef3; --heat1:#cfd9f8; --heat2:#97acef; --heat3:#5a78e0; --heat4:#2f4fd1;
  --shadow:0 8px 30px rgba(20,28,60,.14);
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151d; --panel:#1a1e29; --sunk:#232836; --line:#2e3445; --fg:#e6e9f2; --muted:#9aa2b8;
  --accent:#8fa2ff; --accent-ink:#11152a; --accent-soft:#262f55;
  --ok:#5cc897; --ok-soft:#173829; --warn:#f0b452; --warn-soft:#3b2d14; --crit:#f07a72; --crit-soft:#43201e; --idle:#9aa2b8; --idle-soft:#262b38;
  --m-yut:#79a6ff; --m-tai:#4cc9c4; --m-pe:#f0955c; --m-ing:#c595f0; --m-dream:#f07fa8;
  --heat0:#222736; --heat1:#283668; --heat2:#3a4f9c; --heat3:#5c74d6; --heat4:#8fa2ff;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --panel:#1a1e29; --sunk:#232836; --line:#2e3445; --fg:#e6e9f2; --muted:#9aa2b8;
  --accent:#8fa2ff; --accent-ink:#11152a; --accent-soft:#262f55;
  --ok:#5cc897; --ok-soft:#173829; --warn:#f0b452; --warn-soft:#3b2d14; --crit:#f07a72; --crit-soft:#43201e; --idle:#9aa2b8; --idle-soft:#262b38;
  --m-yut:#79a6ff; --m-tai:#4cc9c4; --m-pe:#f0955c; --m-ing:#c595f0; --m-dream:#f07fa8;
  --heat0:#222736; --heat1:#283668; --heat2:#3a4f9c; --heat3:#5c74d6; --heat4:#8fa2ff;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.01em}
.brand small{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:9px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.spacer{flex:1}
.theme{display:flex;gap:2px;border:1px solid var(--line);border-radius:8px;padding:2px}
.theme button{border:0;background:none;padding:4px 9px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:12px}
.theme button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.dot.on{background:var(--ok)}

main{max-width:1240px;margin:0 auto;padding-block:20px 60px;display:grid;gap:22px}
h2{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec{display:grid;gap:12px;min-width:0}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.sec-h p{margin:0;color:var(--muted);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--panel);padding:14px 16px;display:grid;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .v.crit{color:var(--crit)} .kpi .v.warn{color:var(--warn)}

/* team cards */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px}
.mcard{padding:14px;display:grid;gap:10px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;position:relative}
.mcard:hover{border-color:var(--mc)}
.mcard-h{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#fff;background:var(--mc);font-size:13px;flex:none}
.mcard-h .nm{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.2}
.mcard-h .sub{font-size:12px;color:var(--muted)}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mstats div{display:grid}
.mstats b{font-family:var(--f-mono);font-size:17px;font-weight:600}
.mstats span{font-size:11.5px;color:var(--muted)}
.spark{width:100%;height:38px;display:block}
.spark-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.miss{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--crit-soft);color:var(--crit);font-weight:600}
.sent{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--ok-soft);color:var(--ok);font-weight:600}

/* heatmap */
.heat-wrap{overflow-x:auto;padding:14px}
.heat{border-collapse:separate;border-spacing:3px;font-size:12px}
.heat th{font-weight:500;color:var(--muted);padding:0 4px;white-space:nowrap}
.heat th.who{text-align:left;color:var(--fg);font-weight:600;padding-right:10px}
.heat td{width:46px;height:30px;text-align:center;border-radius:5px;font-family:var(--f-mono);font-size:11.5px}
.h0{background:var(--heat0);color:var(--muted)} .h1{background:var(--heat1)} .h2{background:var(--heat2)} .h3{background:var(--heat3);color:#fff} .h4{background:var(--heat4);color:var(--accent-ink)}
.hx{background:repeating-linear-gradient(45deg,var(--sunk) 0 4px,transparent 4px 8px);color:var(--crit);font-weight:600}
.heat td.tot{background:none;font-weight:600;color:var(--fg);width:auto;padding:0 6px}
.heat td{width:58px;height:40px;line-height:1.1}
.heat td b{display:block;font-weight:600;font-size:13px}
.heat td small{display:block;font-size:10px;opacity:.75}
.heat th.off{opacity:.5}
.hoff{background:none;color:var(--muted);opacity:.5}
.weekbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.weekbar select{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel, var(--bg));color:var(--fg)}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.list{display:grid}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;padding:10px 14px;border-top:1px solid var(--line);align-items:start;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.li:hover{background:var(--sunk)}
.li .t{min-width:0;overflow-wrap:anywhere}
.li .t small{display:block;color:var(--muted);font-size:12.5px}
.li .r{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.pip{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--mc)}
.empty{padding:18px;color:var(--muted);font-size:13px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-todo{background:var(--idle-soft);color:var(--idle)} .st-prog{background:var(--accent-soft);color:var(--accent)}
.st-wait{background:var(--warn-soft);color:var(--warn)} .st-done{background:var(--ok-soft);color:var(--ok)} .st-stop{background:var(--crit-soft);color:var(--crit)}
.pri{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:4px}
.pri-high{background:var(--crit-soft);color:var(--crit)} .pri-medium{background:var(--warn-soft);color:var(--warn)} .pri-low{background:var(--idle-soft);color:var(--idle)}
.tag{font-size:11.5px;padding:0 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.proj{border-color:var(--accent);color:var(--accent)}
.tag.rnd{border-color:var(--m-ing);color:var(--m-ing)}
.tag.nonproj{border-color:var(--m-tai);color:var(--m-tai)}
.types{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%;padding-top:10px;border-top:1px solid var(--line)}
.tchip{display:inline-flex;align-items:baseline;gap:6px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--muted);font-size:12.5px}
.tchip b{font-size:15px;color:var(--fg)}
.tchip.proj b{color:var(--accent)} .tchip.nonproj b{color:var(--m-tai)} .tchip.rnd b{color:var(--m-ing)}
.tchip[aria-pressed="true"]{border-color:var(--fg);background:var(--sunk);color:var(--fg)}
.bank{font-size:11px;padding:0 6px;border-radius:4px;background:var(--accent);color:var(--accent-ink);font-weight:600}

/* person view */
.who-bar{display:flex;flex-wrap:wrap;gap:8px}
.who-bar button{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--line);background:var(--panel);border-radius:99px;cursor:pointer}
.who-bar button .av{width:26px;height:26px;font-size:11px}
.who-bar button[aria-pressed="true"]{border-color:var(--mc);box-shadow:inset 0 0 0 1px var(--mc)}
.who-bar .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ptools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 12px;cursor:pointer;color:var(--muted);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);font-weight:500}
.search{flex:1;min-width:160px;max-width:300px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.phead{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;padding:14px 16px}
.phead .av{width:44px;height:44px;font-size:15px}
.phead .nm{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.1}
.phead .fact{display:grid}
.phead .fact b{font-family:var(--f-mono);font-size:18px}
.phead .fact span{font-size:12px;color:var(--muted)}

.tbl-wrap{overflow-x:auto}
table.tasks{width:100%;border-collapse:collapse;min-width:820px}
.tasks th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.sortbtn{border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;display:inline-flex;gap:4px;align-items:center}
.sortbtn span{opacity:.45;font-size:10px}
.sortbtn:hover,.sortbtn.on{color:var(--fg)}
.sortbtn.on span{opacity:1;color:var(--accent)}
.tasks td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tasks tr:last-child td{border-bottom:0}
.tasks tbody tr{cursor:pointer}
.tasks tbody tr:hover td{background:var(--sunk)}
.tasks .ttl{font-weight:500}
.tasks .det{color:var(--muted);font-size:12.5px;margin-top:2px;max-width:46ch}
.tasks td.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.age-hot{color:var(--crit);font-weight:600}
.age-warm{color:var(--warn);font-weight:600}
tr.closed td{opacity:.62}

/* daily feed */
.days{display:grid;gap:12px}
.day{padding:0}
.day-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border-bottom:1px solid var(--line)}
.day-h b{font-family:var(--f-display);font-size:15px}
.ubar{flex:1;min-width:120px;max-width:260px;height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.ubar i{display:block;height:100%;background:var(--accent)}
.ent{display:grid;grid-template-columns:62px 1fr auto;gap:2px 12px;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
.ent:first-of-type{border-top:0}
.ent:hover{background:var(--sunk)}
.ent .sec{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:3px;display:block}
.ent .t{min-width:0;overflow-wrap:anywhere}
.ent .t small{display:block;color:var(--muted);font-size:12.5px}
.ent .m{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}

/* follow-ups */
.fu{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.fu:first-child{border-top:0}
.fu .q{font-weight:500}
.fu .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted);align-items:center}
.fu .ans{font-size:12.5px;color:var(--ok);background:var(--ok-soft);padding:3px 8px;border-radius:6px;justify-self:start}
.fu .act{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.fu .act input{flex:1;min-width:160px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.btn{border:1px solid var(--line);background:var(--panel);padding:5px 12px;border-radius:7px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri-btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-align:left}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,30,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dr-h{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.dr-top{display:flex;gap:10px;align-items:flex-start}
.dr-top h2{flex:1;font-size:18px;overflow-wrap:anywhere}
.x{border:1px solid var(--line);background:var(--panel);width:32px;height:32px;border-radius:8px;cursor:pointer;flex:none;font-size:16px;line-height:1}
.dr-b{overflow-y:auto;padding:16px 18px 30px;display:grid;gap:20px;align-content:start}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px}
.facts div{display:grid;min-width:0}
.facts span{font-size:11.5px;color:var(--muted)}
.facts b{font-weight:500;overflow-wrap:anywhere}
.form{display:grid;gap:8px;padding:14px;background:var(--sunk);border-radius:10px}
.form .row{display:flex;flex-wrap:wrap;gap:8px}
.form select,.form textarea{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.form textarea{width:100%;min-height:70px;resize:vertical}
.form .hint{font-size:12px;color:var(--muted)}
.tl{display:grid;gap:0;position:relative}
.tl-day{display:grid;grid-template-columns:72px 1fr;gap:10px;padding-bottom:14px;position:relative}
.tl-day::before{content:"";position:absolute;left:84px;top:6px;bottom:0;width:2px;background:var(--line)}
.tl-day:last-child::before{display:none}
.tl-date{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px;text-align:right}
.tl-date b{display:block;color:var(--fg);font-size:13px}
.tl-items{display:grid;gap:8px;padding-left:16px;position:relative}
.tl-items::before{content:"";position:absolute;left:-1px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.tl-e{display:grid;gap:3px;min-width:0}
.tl-e .h{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.tl-e p{margin:0;overflow-wrap:anywhere}
.tl-e.mine{background:var(--accent-soft);padding:8px 10px;border-radius:8px}
.modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 32px));max-height:calc(100% - 48px);
  background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal h2{flex:1;font-size:17px}
.modal textarea{flex:1;min-height:320px;width:100%;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);
  font-family:var(--f-mono);font-size:13px;line-height:1.6;white-space:pre}
/* present: the slide is a fixed 16:9 artboard in one deliberate light look, so a screenshot pastes cleanly into any deck */
.pv-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pv-stage{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:hidden}
.pv-fit{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden}
.pv-stage:fullscreen{display:grid;place-items:center;padding:0;border:0;border-radius:0;background:#e9ebef}
.pv-stage:fullscreen .pv-fit{width:min(100vw,calc(100vh * 16 / 9))}
.slide{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;background:#f1f2f6;color:#1d1d1f;
  font-family:"IBM Plex Sans Thai",system-ui,sans-serif;padding:26px 34px;display:flex;flex-direction:column;gap:18px;color-scheme:light}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;font-family:"Bai Jamjuree",sans-serif}
.sl-top b{font-size:30px;font-weight:700;color:#1d1d1f}
.sl-top span{font-size:20px;color:#55595f}
.sl-t{width:100%;border-collapse:separate;border-spacing:0 3px;table-layout:fixed;font-size:19px}
.sl-t th{color:#fff;font-weight:700;padding:7px 12px;font-size:19px;text-align:center;border-left:3px solid #f1f2f6}
.sl-t th:first-child{border-left:0}
.sl-t td{padding:5px 12px;border-left:3px solid #f1f2f6;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;height:36px;color:#1d1d1f}
.sl-t td:first-child{border-left:0}
.sl-t td small{font-size:15px;color:#3b3e44}

<script>
(() => {
const MEMBERS = {
  Yut:   { name: "Yut",   full: "Sarayuth",  st: "SARAYUTH", c: "var(--m-yut)" },
  Tai:   { name: "Tai",   full: "Apichat",   st: "TAI",      c: "var(--m-tai)" },
  Pe:    { name: "Pe",    full: "Jirat",     st: "JIRAT",    c: "var(--m-pe)" },
  Ing:   { name: "Ing",   full: "Ingkarat",  st: "ING",      c: "var(--m-ing)" },
  DREAM: { name: "DREAM", full: "Ronachai",  st: "DREAM",    c: "var(--m-dream)" },
};
const ORDER = ["Yut", "Tai", "Pe", "Ing", "DREAM"];

const tryLS0 = k => { try { return localStorage.getItem(k); } catch { return null; } };
const S = { cuWho: tryLS0("bss-cuwho") || "all", cuDays: +(tryLS0("bss-cudays") || 10), cuQ: "", cuSt: "", cuFlagOnly: false, cuShowDone: false, cuProj: null, cuProjDone: false, cuCell: null, cuAct: null, cuActDate: null, cuWt: null, cuSorts: { t: { k: "due", dir: 1 }, p: { k: "tracked", dir: -1 } }, cuWtView: tryLS0("bss-cuwtview") || "chart", cuCustView: tryLS0("bss-cucustview") || "chart", sync: {} };

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function stCat(s) {
  const x = (s || "").toLowerCase();
  if (!x || x === "?") return "todo";
  if (/cancel|ยกเลิก/.test(x)) return "stop";
  if (/^(done|complete|completed)\b|ปิด/.test(x) && !/deploy/.test(x)) return "done";
  if (/wait|รอ|pending|tester|uat|review|hold|deploy|follow|ต้องทำเป็น/.test(x)) return "wait";
  if (/progress|wip|found|ตรวจ/.test(x)) return "prog";
  if (/queue|to ?do|planned/.test(x)) return "todo";
  return "prog";
}
const pill = s => `<span class="pill st-${stCat(s)}">${esc(s || "ไม่ระบุ")}</span>`;
const mc = code => `--mc:${MEMBERS[code]?.c || "var(--accent)"}`;
const av = code => `<span class="av" style="${mc(code)}">${esc((code || "?").slice(0, 2).toUpperCase())}</span>`;
const tryLS = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } };
const dm = d => d ? `${+d.slice(8, 10)}/${+d.slice(5, 7)}` : "–";
const DOW = ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"];
const dow = d => DOW[new Date(d + "T00:00:00").getDay()];
const addDays = (d, n) => new Date(Date.parse(d + "T00:00:00Z") + n * 864e5).toISOString().slice(0, 10);

/* ---------- theme ---------- */
function setTheme(t) {
  if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  document.querySelectorAll(".theme button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.th === t)));
  tryLS("bss-theme", t);
}
document.querySelectorAll(".theme button").forEach(b => b.onclick = () => setTheme(b.dataset.th));
setTheme(tryLS("bss-theme") || "system");

/* ---------- ClickUp portal: central list ✅ ITSM Project & Ticket Lists + time entries (clickup.json) ---------- */
const CU_STALE = 5, CU_CAP = 6;
const cuToday = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Bangkok" });
function cuCat(t) {
  if (t.status_type === "closed") return "done";
  const s = t.status.toLowerCase();
  if (/queue/.test(s)) return "todo";
  if (/progress/.test(s)) return "prog";
  return "wait";
}
function cuWorkdays(n) {
  const out = [], T = cuToday();
  for (let d = T; out.length < n; d = addDays(d, -1)) { const w = new Date(d + "T00:00:00Z").getUTCDay(); if (w % 6) out.unshift(d); }
  return out;
}
function cuFlags(t) {
  if (cuCat(t) === "done") return [];
  const T = cuToday(), f = [];
  if (!t.who.length) f.push(["crit", "ไม่มีคนรับ"]);
  if (t.due && t.due < T) f.push(["crit", `เลย Due ${Math.round((Date.parse(T) - Date.parse(t.due)) / 864e5)} วัน`]);
  if (!t.due) f.push(["warn", "ไม่มี Due"]);
  if (!t.ref) f.push(["warn", "ไม่มี Job ID"]);
  const idle = Math.round((Date.parse(T) - Date.parse(t.updated)) / 864e5);
  if (idle >= CU_STALE) f.push(["warn", `ไม่ขยับ ${idle} วัน`]);
  if (!t.spent_h && cuCat(t) === "prog") f.push(["idle", "ยังไม่ลงเวลา"]);
  return f;
}
const cuWho = t => S.cuWho === "all" || t.who.includes(S.cuWho);
function vClickup() {
  const C = S.cu;
  if (C === undefined) { loadCU(); return `<div class="panel empty">กำลังโหลดข้อมูลจาก ClickUp…</div>`; }
  if (!C) return `<div class="panel empty">ยังไม่มีข้อมูล กดปุ่ม “Sync ตอนนี้” ด้านบน ใช้เวลาประมาณ 1 นาที</div>`;
  const T = cuToday(), D = cuWorkdays(S.cuDays), from = D[0];
  const team = ORDER;
  const open = C.tasks.filter(t => cuCat(t) !== "done");
  const mineOpen = open.filter(cuWho);
  const closedP = C.tasks.filter(t => cuCat(t) === "done" && t.closed && t.closed >= from && cuWho(t));
  const timeP = C.time.filter(e => e.date >= from && e.date <= T && (S.cuWho === "all" ? team.includes(e.who) : e.who === S.cuWho));
  const hP = timeP.reduce((a, e) => a + e.h, 0);
  const late = mineOpen.filter(t => t.due && t.due < T).length, stale = mineOpen.filter(t => cuFlags(t).some(f => /ไม่ขยับ/.test(f[1]))).length;
  const nobody = open.filter(t => !t.who.length).length;
  const pulled = new Date(C.pulled_at).toLocaleString("th-TH", { timeZone: "Asia/Bangkok", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

  // per-person performance over the period
  const perf = team.map(c => {
    const o = open.filter(t => t.who.includes(c));
    const hrsD = D.map(d => C.time.filter(e => e.who === c && e.date === d).reduce((a, e) => a + e.h, 0));
    const past = D.filter(d => d <= T).length, h = hrsD.reduce((a, b) => a + b, 0);
    return { c, open: o.length, prog: o.filter(t => cuCat(t) === "prog").length, wait: o.filter(t => cuCat(t) === "wait").length,

  const keys = Object.keys(m).sort((a, b) => { const ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0) - (ib < 0) || (ia - ib) || tot(b) - tot(a); });
  const max = Math.max(...keys.flatMap(k => D.map(d => m[k][d] || 0)));
  const cell = (h, d) => { if (d > T) return `<td class="hoff">–</td>`; if (!h) return `<td class="h0">–</td>`;

  root.querySelectorAll("[data-cuwho]").forEach(el => el.onclick = () => { S.cuWho = S.cuWho === el.dataset.cuwho && el.tagName === "TR" ? "all" : el.dataset.cuwho; tryLS("bss-cuwho", S.cuWho); render(); });
  root.querySelectorAll("[data-cudays]").forEach(el => el.onclick = () => { S.cuDays = +el.dataset.cudays; tryLS("bss-cudays", String(S.cuDays)); render(); });
  root.querySelectorAll("[data-cust]").forEach(el => el.onclick = () => { S.cuSt = S.cuSt === el.dataset.cust ? "" : el.dataset.cust; render(); });
  const q = root.querySelector("#cuq");
  if (q) q.oninput = () => { S.cuQ = q.value; const pos = q.selectionStart; render(); const n = $("#cuq"); n.focus(); n.setSelectionRange(pos, pos); };
  const fl = root.querySelector("#cuflag"); if (fl) fl.onchange = () => { S.cuFlagOnly = fl.checked; render(); };
  const dn = root.querySelector("#cudone"); if (dn) dn.onchange = () => { S.cuShowDone = dn.checked; render(); };
}

function render() {
  const app = $("#app");
  app.innerHTML = vClickup();
  if (S.cu) wireClickup(app);
}

/* ---------- data + sync ---------- */
// Netlify: /api/clickup returns {data, state}. Without the API (local preview) fall back to a static clickup.json.
function loadCU() {
  if (S.cuLoading) return; S.cuLoading = true;
  fetch("/api/clickup", { cache: "no-store" }).then(r => { if (r.status === 401) { location.reload(); throw 0; } if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(j => { S.cu = j.data || null; S.sync = j.state || {}; if (!j.data) S.cu = null; })
    .catch(e => e === 0 ? null : fetch("clickup.json").then(r => r.json()).then(d => { S.cu = d; S.sync = { local: true }; }).catch(() => { S.cu = null; }))
    .finally(() => { S.cuLoading = false; syncUI(); render(); });
}
const ago = iso => { const m = Math.round((Date.now() - Date.parse(iso)) / 6e4); return m < 1 ? "เมื่อสักครู่" : m < 60 ? `${m} นาทีที่แล้ว` : m < 1440 ? `${Math.floor(m / 60)} ชม. ${m % 60} นาทีที่แล้ว` : `${Math.floor(m / 1440)} วันที่แล้ว`; };
function syncUI() {
  const st = S.sync || {}, box = $("#cmsync"), btn = $("#cmsyncbtn"), txt = $("#cmsynctxt");
  const pulled = S.cu?.pulled_at;
  $("#asof").textContent = pulled ? `ข้อมูล ณ ${new Date(pulled).toLocaleString("th-TH", { timeZone: "Asia/Bangkok", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })} · กด Sync ตอนนี้เพื่อดึงใหม่` : "ยังไม่มีข้อมูล กด Sync ตอนนี้";
  box.classList.toggle("busy", !!st.running);
  btn.disabled = !!st.running || !!st.local;
  btn.lastChild.textContent = st.running ? "กำลัง sync…" : "Sync ตอนนี้";
  txt.innerHTML = st.local ? "โหมดไฟล์ในเครื่อง" : st.error ? `<span class="err" title="${esc(st.error)}">sync ล่าสุดไม่สำเร็จ</span>` : pulled ? esc(ago(pulled)) : "";
}
let poll = null;
function watchSync() {
  clearInterval(poll);
  const was = S.cu?.pulled_at;
  poll = setInterval(async () => {
    try {
      const j = await (await fetch("/api/sync", { cache: "no-store" })).json(); S.sync = j.state || {}; syncUI();
      if (!S.sync.running) { clearInterval(poll); if (S.sync.pulled_at && S.sync.pulled_at !== was) { S.cuLoading = false; loadCU(); } }
    } catch { clearInterval(poll); }
  }, 4000);
}
$("#cmsyncbtn").onclick = async () => {
  const btn = $("#cmsyncbtn"); btn.disabled = true;
  try {
    const r = await fetch("/api/sync", { method: "POST" }), j = await r.json();
    S.sync = { ...(j.state || {}), running: j.ok || j.why === "running" };
    if (j.why === "cooldown") { S.sync.running = false; $("#cmsynctxt").textContent = "เพิ่ง sync ไป รอ 2 นาทีแล้วค่อยกดอีกครั้ง"; btn.disabled = false; return; }
    if (!j.ok && j.why !== "running") { S.sync.error = j.why || "sync ไม่สำเร็จ"; }
  } catch { S.sync = { error: "ติดต่อ server ไม่ได้" }; }
  syncUI(); if (S.sync.running) watchSync();
};
// keep the "x minutes ago" label fresh and pick up syncs someone else started (reads our API only, no ClickUp calls)
setInterval(async () => {
  if (document.hidden || S.sync?.running || S.sync?.local) return;
  try { const j = await (await fetch("/api/sync", { cache: "no-store" })).json(); S.sync = j.state || {}; if (S.sync.running) watchSync(); else if (S.sync.pulled_at && S.sync.pulled_at !== S.cu?.pulled_at) { S.cuLoading = false; loadCU(); } else syncUI(); } catch {}
}, 5 * 60e3);
setInterval(syncUI, 60e3);

const tip = document.createElement("div"); tip.className = "cu-tip"; tip.setAttribute("role", "tooltip"); document.body.appendChild(tip);
document.addEventListener("pointerover", ev => { const t = ev.target.closest?.("[data-tip]"); if (!t) { tip.classList.remove("on"); return; } tip.textContent = t.dataset.tip; tip.classList.add("on"); });
document.addEventListener("pointermove", ev => { if (!tip.classList.contains("on")) return; const w = tip.offsetWidth, x = Math.min(innerWidth - w - 8, ev.clientX + 12); tip.style.transform = `translate(${Math.max(8, x)}px,${ev.clientY + 16}px)`; });
document.addEventListener("scroll", () => tip.classList.remove("on"), { passive: true });

loadCU();
})();
</script>
</body>
